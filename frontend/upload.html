<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resume Upload | AI Resume Analyzer</title>

<link rel="stylesheet" href="upload.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<h1>Upload Your Resume</h1>

<p>Select your resume and target job role for ATS analysis.</p>

<div class="upload-box" id="dropArea">

<i class="fa-solid fa-cloud-arrow-up"></i>

<h3>Drag & Drop Resume Here</h3>

<p>or</p>

<label for="resumeFile" class="browse-btn">
Browse File
</label>

<input
type="file"
id="resumeFile"
accept=".pdf,.doc,.docx"
hidden>

<p id="fileName">
No file selected
</p>

</div>

<div class="role-box">

<label>Select Job Role</label>

<select id="jobRole">

<option value="">Choose Role</option>

<option>Software Engineer</option>

<option>Java Developer</option>

<option>Python Developer</option>

<option>Frontend Developer</option>

<option>Backend Developer</option>

<option>Full Stack Developer</option>

<option>Data Scientist</option>

<option>Data Analyst</option>

<option>AI Engineer</option>

<option>Machine Learning Engineer</option>

<option>Cyber Security</option>

</select>

</div>

<div class="progress-area">

<div class="progress-bar">

<div class="progress" id="progress"></div>

</div>

<p id="progressText">
0%
</p>

</div>

<button id="analyzeBtn">
Analyze Resume
</button>

<a href="index.html" class="back">
← Back to Home
</a>

</div>

<script>

const fileInput=document.getElementById("resumeFile");
const fileName=document.getElementById("fileName");

const dropArea=document.getElementById("dropArea");

const progress=document.getElementById("progress");

const progressText=document.getElementById("progressText");

fileInput.addEventListener("change",uploadFile);

dropArea.addEventListener("dragover",e=>{
e.preventDefault();
dropArea.classList.add("active");
});

dropArea.addEventListener("dragleave",()=>{
dropArea.classList.remove("active");
});

dropArea.addEventListener("drop",e=>{

e.preventDefault();

dropArea.classList.remove("active");

fileInput.files=e.dataTransfer.files;

uploadFile();

});

function uploadFile(){

let file=fileInput.files[0];

if(!file) return;

let extension=file.name.split('.').pop().toLowerCase();

if(extension!="pdf" && extension!="doc" && extension!="docx"){

alert("Only PDF and DOCX files are allowed.");

fileInput.value="";

fileName.innerHTML="No file selected";

return;

}

fileName.innerHTML=file.name;

let width=0;

let interval=setInterval(()=>{

if(width>=100){

clearInterval(interval);

}

else{

width++;

progress.style.width=width+"%";

progressText.innerHTML=width+"%";

}

},20);

}

document.getElementById("analyzeBtn").onclick=function(){

if(fileInput.files.length==0){

alert("Please upload a resume.");

return;

}

if(document.getElementById("jobRole").value==""){

alert("Please select a job role.");

return;

}

window.location.href="dashboard.html";

};

</script>

</body>
</html>
